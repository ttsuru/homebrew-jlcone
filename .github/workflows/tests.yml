name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  tap-syntax:
    name: tap syntax (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # readall + style + audit for every formula and cask in the tap.
      - run: brew test-bot --only-tap-syntax

      # setup-homebrew checks the tap out under Homebrew's Taps directory,
      # not $GITHUB_WORKSPACE, so run actionlint from there.
      - name: Lint GitHub Actions workflows
        if: runner.os == 'Linux'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          brew install actionlint
          cd "$(brew --repository "$TAP_NAME")"
          actionlint

  cask:
    # The cask ships a separate dmg per architecture, so cover both.
    name: cask audit and install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust this tap
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew trust --tap "$TAP_NAME"

      - name: Style
        run: brew style --cask ttsuru/jlcone/jlcone

      - name: Audit (strict, online)
        run: brew audit --cask --strict --online ttsuru/jlcone/jlcone

      - name: Livecheck matches the cask version
        run: |
          brew livecheck --cask --debug ttsuru/jlcone/jlcone
          brew livecheck --cask --json ttsuru/jlcone/jlcone | tee livecheck.json
          brew ruby -e '
            require "json"
            result = JSON.parse(File.read("livecheck.json")).first
            current = result.dig("version", "current")
            latest = result.dig("version", "latest")
            abort "livecheck failed: #{result.inspect}" if latest.nil?
            abort "cask is out of date: #{current} -> #{latest}" if current != latest
          '

      - name: Fetch and verify checksum
        run: brew fetch --cask ttsuru/jlcone/jlcone

      - name: Install
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          brew install --cask --verbose ttsuru/jlcone/jlcone
          test -d /Applications/JLCONE.app
          # Must be signed by the vendor's Developer ID team and notarized.
          codesign --verify --deep --strict /Applications/JLCONE.app
          codesign -dvv /Applications/JLCONE.app 2>&1 | grep -F "TeamIdentifier=FPD7225NBW"
          spctl --assess --type execute -vv /Applications/JLCONE.app

      - name: Uninstall and zap
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          brew uninstall --cask --zap --verbose ttsuru/jlcone/jlcone
          if [ -e /Applications/JLCONE.app ]; then
            echo "leftover after zap: /Applications/JLCONE.app" >&2
            exit 1
          fi
